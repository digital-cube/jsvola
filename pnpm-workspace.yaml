packages:
  - "packages/*"
  - "apps/*"

# Dependencies whose install scripts may run (pnpm refuses the rest). argon2 and
# msgpackr-extract ship prebuilt binaries and need no script: reviewed, denied.
allowBuilds:
  esbuild: true
  argon2: false
  msgpackr-extract: false

# Our own @jsudc/* releases, installed on their release day (TCK6PDM3NP); pnpm's
# minimum release age would hold them back a day. Safe to drop once they are older.
minimumReleaseAgeExclude:
  - "@jsudc/core@0.3.0"
  - "@jsudc/react@0.3.1"
  - "@jsudc/server@0.3.0"
