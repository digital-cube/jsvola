# =====================================================================
# examples.stage.vol-a.com: the examples stack (apps/examples, docs/EXAMPLES-SITE.md), stage.
#
# TLS is terminated UPSTREAM (the edge, LE wildcard for stage.vol-a.com), so this vhost
# listens on :80 and proxies to the `vola` container on 127.0.0.1:8300 (VOLA_HOST_PORT).
# Checkout: /home/digital/sites/examples.stage.vol-a.com (compose project jsvola-stage).
#
# The exact name only: stage.vol-a.com is the website, its own vhost
# (deploy/website/nginx/stage.vol-a.com.conf).
#
# Install, from that checkout:
#   sudo ln -sfn "$PWD/deploy/examples/nginx/examples.stage.vol-a.com.conf" \
#       /etc/nginx/sites-enabled/examples.stage.vol-a.com
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

upstream jsvola_examples_stage_backend {
    server 127.0.0.1:8300;
}

server {
    listen 80;
    listen [::]:80;

    server_name examples.stage.vol-a.com;

    access_log /var/log/nginx/examples.stage.vol-a.com.access.log;
    error_log  /var/log/nginx/examples.stage.vol-a.com.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # multipart upload (the demo caps at 5 MiB; the edge allows 50m)
    client_max_body_size 50m;

    location / {
        proxy_pass http://jsvola_examples_stage_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS ends on the edge
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket (/vola/udc/subscribe)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Range / streaming downloads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
