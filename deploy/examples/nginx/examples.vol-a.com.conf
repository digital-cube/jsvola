# =====================================================================
# examples.vol-a.com: the examples stack (apps/examples, docs/EXAMPLES-SITE.md), PRODUCTION,
# on digitalcube-production-websites.
#
# TLS is terminated UPSTREAM (the edge hetzner2, LE lineage examples.vol-a.com, Host forwarded
# unchanged), so this vhost listens on :80 and proxies to the vola server, the systemd user
# unit vola-prod.service on 127.0.0.1:8300 (not a container: nothing on this VM is).
# Stage sibling: examples.stage.vol-a.com.conf (the same proxy, a compose stack on stage).
#
# The exact name only: vol-a.com is the website, its own vhost
# (deploy/website/nginx/vol-a.com.conf).
#
# Installed by `deploy/examples/prod.sh --install`, two steps as every site on this VM:
#   /etc/nginx/sites-available/examples.vol-a.com -> /home/digital/sites/examples.vol-a.com/src/deploy/examples/nginx/examples.vol-a.com.conf
#   /etc/nginx/sites-enabled/examples.vol-a.com   -> /etc/nginx/sites-available/examples.vol-a.com
# The hand-written "coming soon" vhost that was there is kept as
# sites-available/examples.vol-a.com.coming-soon. A deploy that changes this file reloads nginx.
# =====================================================================

upstream jsvola_examples_prod_backend {
    server 127.0.0.1:8300;
}

server {
    listen 80;
    listen [::]:80;

    server_name examples.vol-a.com;

    access_log /var/log/nginx/examples.vol-a.com.access.log;
    error_log  /var/log/nginx/examples.vol-a.com.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # multipart upload (the demo caps at 5 MiB; the edge allows 50m)
    client_max_body_size 50m;

    location / {
        proxy_pass http://jsvola_examples_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS ends on the edge
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket (/vola/udc/subscribe)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Range / streaming downloads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
