# =====================================================================
# stage.vol-a.com: the vola website (apps/website, Astro + Starlight), stage.
#
# TLS is terminated UPSTREAM (the edge in front of every site on this VM,
# which forwards the Host header unchanged), so this vhost listens on :80 only.
#
# Static files only: deploy/website/stage.sh builds the site into
#   /home/digital/sites/stage.vol-a.com/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# The bare name only: the examples stack is examples.stage.vol-a.com, its
# own vhost (deploy/examples/nginx/examples.stage.vol-a.com.conf).
#
# Install (deploy/website/stage.sh --install does this, from the checkout it deploys):
#   sudo ln -sfn /home/digital/sites/stage.vol-a.com/src/deploy/website/nginx/stage.vol-a.com.conf \
#       /etc/nginx/sites-enabled/stage.vol-a.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/website/stage.sh
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name stage.vol-a.com;

    access_log /var/log/nginx/stage.vol-a.com.access.log;
    error_log  /var/log/nginx/stage.vol-a.com.error.log;

    root  /home/digital/sites/stage.vol-a.com/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
