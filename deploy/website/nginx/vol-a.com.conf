# =====================================================================
# vol-a.com — the vola website (apps/website, Astro + Starlight), production.
#
# VM digitalcube-production-websites (hetzner2). TLS is terminated
# UPSTREAM (the edge h2, Let's Encrypt lineage vol-a.com, which forwards
# the Host header unchanged), so this vhost listens on :80 only.
# www.vol-a.com has no DNS record; it gets a block here when it does.
#
# Static files only: deploy/website/prod.sh builds the site into
#   /home/digital/sites/vol-a.com/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# Install (deploy/website/prod.sh --install does this, from the checkout it
# deploys; the hand-written "coming soon" vhost stays as
# sites-available/vol-a.com.coming-soon, its page in /var/www/vol-a.com):
#   sudo ln -sfn /home/digital/sites/vol-a.com/src/deploy/website/nginx/vol-a.com.conf \
#       /etc/nginx/sites-available/vol-a.com
#   sudo ln -sfn /etc/nginx/sites-available/vol-a.com /etc/nginx/sites-enabled/vol-a.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/website/prod.sh
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name vol-a.com;

    access_log /var/log/nginx/vol-a.com.access.log;
    error_log  /var/log/nginx/vol-a.com.error.log;

    root  /home/digital/sites/vol-a.com/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
