# Production-like JSVola stack: the vola server + the vola worker + PostgreSQL + Redis.
#   docker compose -f docker-compose.yaml up -d --build
#   curl localhost:8300/vola/health/live
# The examples site (apps/examples, docs/EXAMPLES-SITE.md) is the same image at /: set
# VOLA_EXAMPLES=true and the two demo keys in .env (`vola demo-keys` prints a pair) and bring
# the `demo` profile up — its `seeder` fills the demo instance with the pack:
#   docker compose -f docker-compose.yaml --profile demo up -d
# (compose.yaml next to it is the development infrastructure: PostgreSQL + Redis only.)
# Every ${VAR} can be set in the shell or in a .env file next to this file.
name: jsvola

services:
  vola:
    image: ${VOLA_IMAGE:-ghcr.io/digital-cube/jsvola:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VOLA_DATABASE_URL: postgresql://${POSTGRES_USER:-vola}:${POSTGRES_PASSWORD:-vola}@postgres:5432/${POSTGRES_DB:-vola}
      VOLA_REDIS_URL: redis://redis:6379/0
      VOLA_PORT: 8300
      VOLA_PREFIX: ${VOLA_PREFIX:-/vola}
      VOLA_LOG_LEVEL: ${VOLA_LOG_LEVEL:-info}
      VOLA_STORAGE_PATH: /data/storage
      # `0` here means no OCR job is ever queued (the worker's own setting decides whether it runs).
      VOLA_OCR_ENABLED: ${VOLA_OCR_ENABLED:-auto}
      # The origin share links are built on (behind a reverse proxy); empty: the request's Host.
      VOLA_PUBLIC_URL: ${VOLA_PUBLIC_URL:-}
      VOLA_STATS_TTL_MIN: ${VOLA_STATS_TTL_MIN:-60}
      # Behind a reverse proxy: the client address from X-Forwarded-For (the demo rate limit).
      VOLA_TRUST_PROXY: ${VOLA_TRUST_PROXY:-false}
      # The examples site (docs/EXAMPLES-SITE.md): served at / by this image (VOLA_UI_DIR=/app/ui
      # is set in the image). With VOLA_EXAMPLES=true the server stores the two keys at start
      # (the read-only visitor key, the write key the write proxy uses), creates the `demo`
      # tenant when missing, serves GET /vola/examples/config and purges what visitors leave
      # after VOLA_DEMO_TTL_HOURS. Empty: the site is served but asks for a key.
      VOLA_EXAMPLES: ${VOLA_EXAMPLES:-false}
      VOLA_DEMO_API_KEY: ${VOLA_DEMO_API_KEY:-}
      VOLA_DEMO_WRITE_KEY: ${VOLA_DEMO_WRITE_KEY:-}
      VOLA_DEMO_TENANT: ${VOLA_DEMO_TENANT:-demo}
      VOLA_DEMO_TTL_HOURS: ${VOLA_DEMO_TTL_HOURS:-24}
      VOLA_DEMO_MAX_UPLOAD_BYTES: ${VOLA_DEMO_MAX_UPLOAD_BYTES:-5242880}
      VOLA_DEMO_RATE_LIMIT: ${VOLA_DEMO_RATE_LIMIT:-60}
      # Encryption at rest (docs/CRYPTO.md): the key file (`vola keys-generate`, the tenant
      # provider; the worker needs it too) and the pepper file (`vola pepper-generate`, the
      # keyring provider) are read from this directory, VOLA_SECRETS_DIR (default ./secrets).
      # A missing file does not stop the server: encrypted files and keyrings answer 503.
      VOLA_KEY_FILE: /run/secrets/vola/vola.key
      VOLA_PEPPER_FILE: /run/secrets/vola/vola.pepper
    ports:
      - "${VOLA_HOST_PORT:-8300}:8300"
    volumes:
      # the content-addressable blobs (VOLA_STORAGE_PATH=/data/storage)
      - vola-data:/data
      # vola.key and vola.pepper (see VOLA_KEY_FILE above); an empty directory is fine.
      - ${VOLA_SECRETS_DIR:-./secrets}:/run/secrets/vola:ro
    healthcheck:
      test: ["CMD", "vola-healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # The background worker (thumbnails, OCR): the SAME image, `node dist/worker.js`, the
  # SAME /data volume (thumbnails are written next to the blobs). Starts after `vola` is healthy,
  # i.e. after the migrations ran. Scale it with `--scale vola-worker=N`.
  vola-worker:
    image: ${VOLA_IMAGE:-ghcr.io/digital-cube/jsvola:latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      vola:
        condition: service_healthy
    environment:
      VOLA_DATABASE_URL: postgresql://${POSTGRES_USER:-vola}:${POSTGRES_PASSWORD:-vola}@postgres:5432/${POSTGRES_DB:-vola}
      VOLA_REDIS_URL: redis://redis:6379/0
      VOLA_LOG_LEVEL: ${VOLA_LOG_LEVEL:-info}
      VOLA_STORAGE_PATH: /data/storage
      VOLA_WORKER_CONCURRENCY: ${VOLA_WORKER_CONCURRENCY:-2}
      VOLA_STATS_TTL_MIN: ${VOLA_STATS_TTL_MIN:-60}
      VOLA_KEY_FILE: /run/secrets/vola/vola.key
    volumes:
      - vola-data:/data
      - ${VOLA_SECRETS_DIR:-./secrets}:/run/secrets/vola:ro
    healthcheck:
      disable: true

  # The examples site's demo pack (apps/examples/assets, ASSETS.md): `vola demo-seed` uploads
  # it into the demo instance through the API with the write key — an upsert per slug, so it
  # may run at every `up`; it exits when done. Off unless the `demo` profile is on
  # (`--profile demo` or COMPOSE_PROFILES=demo). Same image, no `build:`.
  seeder:
    image: ${VOLA_IMAGE:-ghcr.io/digital-cube/jsvola:latest}
    profiles: ["demo"]
    restart: "no"
    depends_on:
      vola:
        condition: service_healthy
    command: ["vola", "demo-seed"]
    environment:
      VOLA_URL: http://vola:8300${VOLA_PREFIX:-/vola}
      # The write key of the demo tenant, from .env. Not `:?` — compose interpolates every
      # service, profile or not. Without it the command exits with "a write key is required".
      VOLA_DEMO_WRITE_KEY: ${VOLA_DEMO_WRITE_KEY:-}
      VOLA_DEMO_TENANT: ${VOLA_DEMO_TENANT:-demo}
      VOLA_DEMO_ASSETS: /app/demo-assets

  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vola}
      POSTGRES_DB: ${POSTGRES_DB:-vola}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vola-data:
  postgres-data:
  redis-data:
