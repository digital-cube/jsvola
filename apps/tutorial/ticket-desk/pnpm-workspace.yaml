# This folder is its own project, not a member of any repository around it. A file here also
# stops pnpm from walking up to a parent workspace.
packages:
  - "."

# Not on npm yet: see vendor/README.md.
overrides:
  "@vol-a/core": "file:vendor/vol-a-core-1.0.1.tgz"
  "@vol-a/client": "file:vendor/vol-a-client-1.0.1.tgz"
  "@vol-a/react": "file:vendor/vol-a-react-1.0.1.tgz"
  "@memento/core": "file:vendor/memento-core-1.0.0.tgz"
  "@memento/react": "file:vendor/memento-react-1.0.0.tgz"

allowBuilds:
  esbuild: true
