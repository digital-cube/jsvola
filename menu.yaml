# JSVola — the examples site's menu (apps/examples, plan 8.1). This file IS its sidebar.
#
# Served by @vola/server as the `menu` UDC collection (source `yaml_menu` of @jsudc/server,
# POST /vola/udc/list {collection: "menu"}), read again whenever the file changes. Path:
# VOLA_MENU_PATH; default: menu.yaml at the repository root (the Docker image:
# /app/config/menu.yaml). Without the file there is no `menu` collection.
#
# Keys of a node:
#   code             unique among its siblings; letters, digits, _ . -
#   translation_key  <SECTION>_<TERM>, shown through t(section, term) of the site's messages
#   icon             lucide:<kebab-name>, one @jsudc/react's LUCIDE_ICONS has
#   url              a route of the site; a node with a url is a link
#   children         a list of nodes, or "udc:collections": every collection vola serves

- code: FILES
  translation_key: MENU_FILES
  icon: lucide:files
  url: /examples/files
